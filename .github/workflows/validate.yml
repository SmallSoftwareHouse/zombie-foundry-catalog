name: validate catalogue

# A broken catalogue fails silently: installed tools fall back to their cached
# or built-in copy, so the change simply never reaches anyone and nothing looks
# wrong. This job is what turns that into a visible failure, here, before it
# ships.
on:
  push:
    paths: ["plugins-*.json"]
  pull_request:
    paths: ["plugins-*.json"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every catalogue file
        run: |
          python3 - <<'PY'
          import glob, json, sys

          KNOWN_STEPS = {"github_release", "url", "asset", "zip"}
          problems = []

          files = sorted(glob.glob("plugins-*.json"))
          if not files:
              problems.append("no plugins-*.json file found")

          for path in files:
              try:
                  with open(path, encoding="utf-8") as fh:
                      doc = json.load(fh)
              except Exception as exc:
                  problems.append(f"{path}: invalid JSON — {exc}")
                  continue

              entries = doc.get("Plugins")
              if not isinstance(entries, list):
                  problems.append(f"{path}: missing top-level \"Plugins\" array")
                  continue

              seen = set()
              for i, e in enumerate(entries):
                  where = f"{path}[{i}]"
                  pid = e.get("Id")
                  if not pid:
                      problems.append(f"{where}: missing Id")
                  elif pid in seen:
                      problems.append(f"{where}: duplicate Id {pid!r}")
                  else:
                      seen.add(pid)

                  if not e.get("Name"):
                      problems.append(f"{where}: missing Name")

                  # A dependency is never offered in the list: the tool installs
                  # it with the plugin that requires it, so it has no line to
                  # describe itself in.
                  desc = e.get("Desc")
                  if not e.get("Dependency") and (not isinstance(desc, dict) or not desc.get("en")):
                      problems.append(f"{where}: Desc must be an object with at least \"en\"")

                  requires = e.get("Requires")
                  if requires is not None and (
                      not isinstance(requires, list)
                      or not all(isinstance(r, str) and r for r in requires)
                  ):
                      problems.append(f"{where}: Requires must be an array of ids")

                  # Usage e' la legenda dei comandi mostrata nel riquadro del
                  # tool. Non e' obbligatoria — un plugin governato solo da
                  # cvar non ha comandi da elencare — ma se c'e' deve reggere:
                  # una voce scritta male non da' errore da nessuna parte, da'
                  # una legenda vuota o una riga senza spiegazione, che e'
                  # esattamente il tipo di guasto silenzioso per cui questo
                  # controllo esiste.
                  usage = e.get("Usage")
                  if usage is not None:
                      if not isinstance(usage, list):
                          problems.append(f"{where}: Usage must be an array")
                      else:
                          cmds = set()
                          for k, u in enumerate(usage):
                              uw = f"{where}.Usage[{k}]"
                              if not isinstance(u, dict):
                                  problems.append(f"{uw}: must be an object")
                                  continue
                              cmd = u.get("Cmd")
                              if not cmd or not isinstance(cmd, str):
                                  problems.append(f"{uw}: missing Cmd")
                              elif cmd in cmds:
                                  problems.append(f"{uw}: duplicate Cmd {cmd!r}")
                              else:
                                  cmds.add(cmd)
                              what = u.get("What")
                              if not isinstance(what, dict) or not what.get("en"):
                                  problems.append(f"{uw}: What must be an object with at least \"en\"")
                              alt = u.get("Alt")
                              if alt is not None and (
                                  not isinstance(alt, list)
                                  or not all(isinstance(a, str) and a for a in alt)
                              ):
                                  problems.append(f"{uw}: Alt must be an array of non-empty strings")

                  steps = e.get("Steps")
                  if not isinstance(steps, list) or not steps:
                      problems.append(f"{where}: Steps must be a non-empty array")
                      continue

                  for j, s in enumerate(steps):
                      sw = f"{where}.Steps[{j}]"
                      t = s.get("Type")
                      if t not in KNOWN_STEPS:
                          problems.append(f"{sw}: unknown Type {t!r} (known: {sorted(KNOWN_STEPS)})")
                          continue
                      if t == "github_release" and not s.get("Repo"):
                          problems.append(f"{sw}: github_release needs Repo")
                      if t == "url" and not s.get("URL"):
                          problems.append(f"{sw}: url needs URL")
                      if t == "asset" and not s.get("From"):
                          problems.append(f"{sw}: asset needs From")
                      # Everything that is not an archive must say where it lands.
                      if not s.get("Extract") and not s.get("Dest"):
                          problems.append(f"{sw}: needs either Extract or Dest")

              # A plugin that requires an entry the file does not have cannot
              # be installed, and says so only at the end of the procedure.
              for e in entries:
                  for r in e.get("Requires") or []:
                      if isinstance(r, str) and r not in seen:
                          problems.append(f"{path}: {e.get('Id')!r} requires {r!r}, which is not in the catalogue")

          if problems:
              print("Catalogue rejected:\n")
              for p in problems:
                  print(f"  - {p}")
              sys.exit(1)

          print(f"OK — {len(files)} file(s), {sum(len(json.load(open(f, encoding='utf-8'))['Plugins']) for f in files)} plugin(s)")
          PY
